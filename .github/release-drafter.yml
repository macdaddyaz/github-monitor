# Next release version and notes are inferred from merged PRs. Autolabeler maps
# Conventional Commit PR titles to labels; the highest matching increment wins.
name-template: 'v$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
include-pre-releases: true
sync-labels: true
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

categories:
  - title: '💥 Breaking Changes'
    semver-increment: major
    when:
      label: 'breaking'
  - title: '🚀 Features'
    semver-increment: minor
    when:
      label: 'feature'
  - title: '🐛 Fixes'
    semver-increment: patch
    when:
      label: 'fix'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'ci'
        - 'docs'
        - 'dependencies'
  # Anything else (including PRs without a conventional title) is a patch.
  - type: 'version-resolver'
    semver-increment: 'patch'

autolabeler:
  - labels: ['breaking']
    title:
      - '/^\w+(\([^)]*\))?!:/'
    body:
      - '/^BREAKING[ -]CHANGE:/m'
  - labels: ['feature']
    title:
      - '/^feat(\([^)]*\))?!?:/i'
  - labels: ['fix']
    title:
      - '/^(fix|perf)(\([^)]*\))?!?:/i'
  - labels: ['docs']
    title:
      - '/^docs(\([^)]*\))?!?:/i'
  - labels: ['ci']
    title:
      - '/^ci(\([^)]*\))?!?:/i'
  - labels: ['chore']
    title:
      - '/^(chore|build|refactor|test|style)(\([^)]*\))?!?:/i'
